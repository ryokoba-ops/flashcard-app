<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>単語帳アプリ</title>

  <!-- PWA用 -->
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #121212;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial;
    }

    /* ★ iPhone風 */
    #app {
      width: 375px;
      height: 667px;
      border: 2px solid #333;
      border-radius: 20px;
      padding: 20px;
      box-sizing: border-box;
      background-color: #000;
      text-align: center;
    }

    #card {
      width: 100%;
      height: 200px;
      margin: 20px auto;
      border: 2px solid white;
      background-color: #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-all;
    }

    button {
      margin: 5px;
      padding: 10px;
      background-color: #333;
      color: white;
      border: none;
    }

    /* 進捗バー */
    #progressBar {
      width: 100%;
      height: 20px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
    }

    #progressFill {
      height: 100%;
      width: 0%;
      background: #4caf50;
    }
  </style>
</head>
<body>

<div id="app">
  <h3>単語帳</h3>

  <input type="file" id="fileInput">

  <div id="progressBar">
    <div id="progressFill"></div>
  </div>
  <div id="progressText"></div>

  <div id="card">ここに表示</div>

  <div>
    <button onclick="prevCard()">戻る</button>
    <button onclick="flipCard()">めくる</button>
    <button onclick="nextCard()">次へ</button>
    <button onclick="markLearned()">覚えた</button>
    <button onclick="shuffleCards()">シャッフル</button>
    <button onclick="resetProgress()">リセット</button>
  </div>
</div>

<script>
let cards = [];
let currentIndex = 0;
let isFront = true;
let learned = new Set();

const STORAGE_KEY = "flashcard_progress";

// CSV読み込み
document.getElementById("fileInput").addEventListener("change", function(e) {
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = function(event) {
    parseCSV(event.target.result);
    loadProgress();
    showCard();
    updateProgress();
  };

  reader.readAsText(file);
});

// CSV
function parseCSV(text) {
  cards = text.trim().split("\n").map(line => {
    const [front, back] = line.split(",");
    return { front, back };
  });
}

// 表示
function showCard() {
  if (cards.length === 0) return;

  const card = cards[currentIndex];
  const text = isFront ? card.front : card.back;

  const el = document.getElementById("card");
  el.textContent = text;

  adjustFontSize(text);
}

// ★ 文字サイズ自動調整
function adjustFontSize(text) {
  const length = text.length;
  let size = 24;

  if (length > 100) size = 14;
  else if (length > 60) size = 18;
  else if (length > 30) size = 20;

  document.getElementById("card").style.fontSize = size + "px";
}

// めくる
function flipCard() {
  isFront = !isFront;
  showCard();
}

// 次へ
function nextCard() {
  let next = currentIndex;
  do {
    next = (next + 1) % cards.length;
  } while (learned.has(next) && next !== currentIndex);

  currentIndex = next;
  isFront = true;
  showCard();
}

// 戻る
function prevCard() {
  let prev = currentIndex;
  do {
    prev = (prev - 1 + cards.length) % cards.length;
  } while (learned.has(prev) && prev !== currentIndex);

  currentIndex = prev;
  isFront = true;
  showCard();
}

// 覚えた
function markLearned() {
  learned.add(currentIndex);
  saveProgress();
  nextCard();
  updateProgress();
}

// シャッフル
function shuffleCards() {
  cards.sort(() => Math.random() - 0.5);
  showCard();
}

// リセット
function resetProgress() {
  if (confirm("本当にリセットしてよいですか？")) {
    learned.clear();
    localStorage.removeItem(STORAGE_KEY);
    updateProgress();
    showCard();
  }
}

// 保存
function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    learned: Array.from(learned)
  }));
}

// 読み込み
function loadProgress() {
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (!data) return;
  learned = new Set(data.learned);
}

// 進捗
function updateProgress() {
  const percent = cards.length ? (learned.size / cards.length) * 100 : 0;
  document.getElementById("progressFill").style.width = percent + "%";
  document.getElementById("progressText").textContent =
    learned.size + " / " + cards.length;
}
</script>

</body>
</html>
