<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>単語帳アプリ</title>

  <!-- PWA用 -->
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #121212;
      color: white;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* iPhone風 */
    #app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      background-color: #000;
      text-align: center;
      margin: 0 auto;
    }

    #card {
      width: 100%;
      height: 300px;
      margin: 20px auto;
      border: 2px solid white;
      background-color: #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    button {
      margin: 5px;
      padding: 10px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:active {
      background-color: #555;
    }

    /* 進捗バー */
    #progressBar {
      width: 100%;
      height: 20px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
    }

    #progressFill {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.2s;
    }

    #progressText {
      margin-top: 8px;
    }

    #fileInput {
      max-width: 100%;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>
<div id="app">
  <h3>単語帳</h3>

  <input type="file" id="fileInput" accept=".csv,text/csv">

  <div id="progressBar">
    <div id="progressFill"></div>
  </div>

  <div id="progressText">0 / 0</div>

  <div id="card">CSVを読み込んでください</div>

  <div>
    <button onclick="prevCard()">戻る</button>
    <button onclick="flipCard()">めくる</button>
    <button onclick="nextCard()">次へ</button>
    <button onclick="markLearned()">覚えた</button>
    <button onclick="shuffleCards()">シャッフル</button>
    <button onclick="resetProgress()">リセット</button>
  </div>
</div>

<script>
let cards = [];
let currentIndex = 0;
let isFront = true;
let learned = new Set();

const STORAGE_KEY = "flashcard_progress";

/*
 * CSV読み込み
 * カードごとに固定IDを付与する
 */
document.getElementById("fileInput").addEventListener("change", function(e) {
  const file = e.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(event) {
    parseCSV(event.target.result);

    // CSVの内容に対応する学習履歴を読み込む
    loadProgress();

    currentIndex = findNextUnlearnedIndex(0);
    isFront = true;

    showCard();
    updateProgress();
  };

  reader.readAsText(file, "UTF-8");
});

/*
 * CSV解析
 * 1列目：表、2列目：裏
 */
function parseCSV(text) {
  const lines = text
    .replace(/^\uFEFF/, "")
    .split(/\r?\n/)
    .filter(line => line.trim() !== "");

  cards = lines.map((line, index) => {
    const columns = line.split(",");

    return {
      id: index,
      front: (columns[0] || "").trim(),
      back: (columns.slice(1).join(",") || "").trim()
    };
  });
}

/*
 * 未習得カードのインデックスを探す
 */
function findNextUnlearnedIndex(startIndex, direction = 1) {
  if (cards.length === 0) return -1;

  for (let i = 0; i < cards.length; i++) {
    const index =
      (startIndex + direction * i + cards.length) % cards.length;

    if (!learned.has(cards[index].id)) {
      return index;
    }
  }

  return -1;
}

/*
 * カード表示
 */
function showCard() {
  const el = document.getElementById("card");

  if (cards.length === 0) {
    el.textContent = "CSVを読み込んでください";
    return;
  }

  // すべて覚えた場合
  const unlearnedCards = cards.filter(
    card => !learned.has(card.id)
  );

  if (unlearnedCards.length === 0) {
    el.textContent = "全部覚えた！🎉";
    el.style.fontSize = "24px";
    return;
  }

  // 現在のカードが覚えた単語なら、未習得カードへ移動
  if (
    currentIndex < 0 ||
    currentIndex >= cards.length ||
    learned.has(cards[currentIndex].id)
  ) {
    currentIndex = findNextUnlearnedIndex(
      Math.max(currentIndex, 0)
    );
  }

  const card = cards[currentIndex];
  const text = isFront ? card.front : card.back;

  el.textContent = text;
  adjustFontSize(text);
}

/*
 * 文字サイズ自動調整
 */
function adjustFontSize(text) {
  const length = text.length;
  let size = 24;

  if (length > 100) {
    size = 14;
  } else if (length > 60) {
    size = 18;
  } else if (length > 30) {
    size = 20;
  }

  document.getElementById("card").style.fontSize = size + "px";
}

/*
 * カードをめくる
 */
function flipCard() {
  if (cards.length === 0) return;

  isFront = !isFront;
  showCard();
}

/*
 * 次へ
 * 覚えたカードはスキップする
 */
function nextCard() {
  if (cards.length === 0) return;

  const nextIndex = findNextUnlearnedIndex(
    currentIndex + 1
  );

  if (nextIndex === -1) {
    showCard();
    updateProgress();
    return;
  }

  currentIndex = nextIndex;
  isFront = true;

  showCard();
}

/*
 * 戻る
 * 覚えたカードはスキップする
 */
function prevCard() {
  if (cards.length === 0) return;

  const prevIndex = findNextUnlearnedIndex(
    currentIndex - 1,
    -1
  );

  if (prevIndex === -1) {
    showCard();
    return;
  }

  currentIndex = prevIndex;
  isFront = true;

  showCard();
}

/*
 * 覚えた
 * 固定IDを保存するため、シャッフルしても状態がずれない
 */
function markLearned() {
  if (cards.length === 0) return;

  const card = cards[currentIndex];

  if (!card || learned.has(card.id)) return;

  learned.add(card.id);

  saveProgress();
  updateProgress();

  // 次の未習得カードへ
  nextCard();
}

/*
 * シャッフル
 * 未習得カードだけをシャッフルする
 */
function shuffleCards() {
  if (cards.length === 0) return;

  // 未習得カードだけを取り出す
  const unlearnedCards = cards.filter(
    card => !learned.has(card.id)
  );

  // Fisher-Yatesアルゴリズムでシャッフル
  for (let i = unlearnedCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [unlearnedCards[i], unlearnedCards[j]] =
      [unlearnedCards[j], unlearnedCards[i]];
  }

  // 覚えたカードは出題対象から外す
  const learnedCards = cards.filter(
    card => learned.has(card.id)
  );

  // 未習得カードを先頭に配置する
  cards = [...unlearnedCards, ...learnedCards];

  // 未習得カードの先頭から再開
  currentIndex = unlearnedCards.length > 0 ? 0 : -1;
  isFront = true;

  showCard();
}

/*
 * リセット
 */
function resetProgress() {
  if (!confirm("学習履歴をリセットしてよいですか？")) {
    return;
  }

  learned.clear();

  localStorage.removeItem(STORAGE_KEY);

  currentIndex = 0;
  isFront = true;

  updateProgress();
  showCard();
}

/*
 * 学習履歴保存
 * CSVのカードIDを含めて保存する
 */
function saveProgress() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      learned: Array.from(learned),
      cardSignature: getCardSignature()
    })
  );
}

/*
 * CSVの識別情報
 * 異なるCSVの学習履歴を誤って使用しないようにする
 */
function getCardSignature() {
  return JSON.stringify(
    cards
      .slice()
      .sort((a, b) => a.id - b.id)
      .map(card => [card.front, card.back])
  );
}

/*
 * 学習履歴読み込み
 */
function loadProgress() {
  const savedData = localStorage.getItem(STORAGE_KEY);

  learned = new Set();

  if (!savedData) return;

  try {
    const data = JSON.parse(savedData);

    // 以前の形式や異なるCSVの履歴は引き継がない
    if (data.cardSignature !== getCardSignature()) {
      return;
    }

    learned = new Set(
      data.learned.filter(id =>
        cards.some(card => card.id === id)
      )
    );
  } catch (error) {
    learned = new Set();
  }
}

/*
 * 進捗更新
 */
function updateProgress() {
  const total = cards.length;
  const learnedCount = cards.filter(
    card => learned.has(card.id)
  ).length;

  const percent = total
    ? (learnedCount / total) * 100
    : 0;

  document.getElementById("progressFill").style.width =
    percent + "%";

  document.getElementById("progressText").textContent =
    learnedCount + " / " + total +
    "（" + Math.round(percent) + "%）";
}
</script>

</body>
</html>
